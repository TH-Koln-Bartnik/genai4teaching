project:
  type: book
  output-dir: docs
  # Profile: "web" (Standard) fügt die lebenden Online-Seiten hinzu, "print" das Impressum
  # für die Titelei. PDF rendern mit: quarto render --profile print --to pdf
  # (Profile werden additiv zusammengeführt; die Basisliste unten ist der gemeinsame Kern.)
  resources:
    - downloads/**
    - interactions/**
    - images/druck/folie-mit-regeln.png   # Praxisbeispiele-Seite (Gruppe „Folie und Rollenspiel“); als Ressource gesichert, falls die Seite das Bild nicht mehr einbindet
    # Weiterleitungen der Adressen vor der neuen Gliederung (04.11.2026), erzeugt von scripts/umzug/weiterleitungen.py
    - kapitel01.html
    - kapitel02.html
    - kapitel03.html
    - kapitel04.html
    - kapitel05.html
    - kapitel06-fallbeispiele.html

profile:
  default: web

# Globale Einstellungen (gelten für alle Kapitel und Formate)
lang: de
number-depth: 4
bibliography: references.json
csl: apa.csl
reference-section-title: "Literaturverzeichnis"
crossref:
  fig-title: Abbildung
  tbl-title: Tabelle
  fig-prefix: Abbildung
  tbl-prefix: Tabelle

# Filter für alle Formate: <br> in Tabellenzellen -> echter Zeilenumbruch
filters:
  - _filters/br-linebreak.lua
  - _filters/einschaetzung.lua
  - _filters/schluesselbegriffe.lua

book:
  title: "Generative KI als Hilfe zum Lehren und Lernen"
  author: "Roman Bartnik"
  date: "2026-11-15"
  date-format: "MMMM YYYY"
  page-navigation: true
  navbar:
    right:
      - text: "Ko-fi"
        href: https://ko-fi.com/romanbartnik
      - text: "Buy me a coffee"
        href: https://buymeacoffee.com/roman.bartnik.th
  chapters:
    - index.qmd
    - part: "Teil I: Grundlagen"
      chapters:
        - kapitel01-einleitung.qmd
        - kapitel02-grundlagen.qmd
        - kapitel03-automation.qmd
        - kapitel04-lernmechanismen.qmd
    - part: "Teil II: Anwendungen"
      chapters:
        - kapitel05-4d-phasen.qmd
        - kapitel06-rollen.qmd
        - kapitel07-artefakte.qmd

  appendices:  # Anhänge werden automatisch A, B, C ... nummeriert
    - kapitel07-appendix02-prompt-sammlung.qmd
    - kapitel10-appendix05-loesungshinweise.qmd
    - anhang-primer.qmd   # Anhang C: Praxis-Primer (10.11.2026 zurückgeholt; steht nach A und B, damit deren Buchstaben bleiben)
    - glossar.qmd
    - transparenz.qmd

  cover-image: images/logos/logo-cover.jpg
  image: images/logos/logo-cover.jpg
  search: true
  output-file: downloads/genai4teaching

  # GitHub-Anbindung und Werkzeuge in der Seitenleiste
  repo-url: https://github.com/TH-Koln-Bartnik/genai4teaching
  repo-branch: main
  repo-actions: [edit, issue, source]
  downloads: [pdf, epub]
  sharing: [twitter, linkedin]

  sidebar:
    style: "floating"

  page-footer:
    left: "Bartnik, Roman (2026). Generative KI als Hilfe zum Lehren und Lernen. Lizenz: CC BY-SA 4.0. Online: https://th-koln-bartnik.github.io/genai4teaching/"

format:
  html:
    toc: true
    toc-location: right
    toc-depth: 4
    toc-expand: 4
    number-sections: true
    code-copy: true
    filters:
      - support-this                # Spendenkasten nur in der Online-Version
    theme:
      light:
        - flatly
        - include/light.scss
      dark:
        - darkly
        - include/dark.scss
    css: [include/booktem.css, include/style.css, include/webex.css]
    include-in-header:
      - include/schrift-vorladen.html   # Webschrift früh laden, weniger Textsprung
    include-after-body:
      - include/einschaetzung.html   # Einschätzungen vorab, Auflösung im Text (Kap. 1–6)
      - include/schluesselbegriffe.html  # Kasten Schlüsselbegriffe am Kapitelende (Kap. 1, Schablone)
      - include/zitat-popup-touch.html  # Zitat-Popup per Tipp statt Sprung (Tablet)

  pdf:
    # Literaturverzeichnis am Ende jedes Kapitels: Quarto setzt im PDF sonst nur ein
    # Gesamtverzeichnis; _filters/kapitel-literatur.lua ruft citeproc je Kapitel auf.
    citeproc: false
    filters:
      - quarto
      - _filters/kapitel-literatur.lua
    # Druckvorlage Logos Verlag: 17 x 24 cm, zweiseitig; Satzspiegel vorläufig,
    # bis die technischen Vorgaben von Logos vorliegen (Mail an Buchholtz, Okt. 2026)
    documentclass: scrbook
    classoption: [twoside, open=right, fontsize=11pt, headings=normal, numbers=noenddot, bibliography=totoc, listof=totoc]
    pdf-engine: xelatex
    mainfont: "TeX Gyre Pagella"
    sansfont: "TeX Gyre Heros"
    monofont: "TeX Gyre Cursor"
    geometry:
      - paperwidth=170mm
      - paperheight=240mm
      - inner=22mm
      - outer=20mm
      - top=24mm
      - bottom=26mm
      - headsep=7mm
      - footskip=12mm
    include-in-header: include/preamble.tex
    number-sections: true
    toc: true
    toc-depth: 2
    toc-title: "Inhalt"
    lof: true
    lot: true
    colorlinks: true
    linkcolor: thred
    urlcolor: thred
    citecolor: thmagenta
    link-citations: true
    fig-pos: "htbp"
    # Codeblöcke (Prompts) als tcolorbox statt framed/snugshade: verhindert
    # weißen (unsichtbaren) Text nach seitenübergreifenden Prompt-Kästen
    code-block-bg: "F5F5F7"
    code-block-border-left: "B43092"
    cap-location: bottom
    keep-tex: true

  epub:
    toc: true
    citeproc: false                 # Literaturverzeichnis je Kapitel wie im PDF
    filters:
      - quarto
      - _filters/kapitel-literatur.lua

extensions:
  support-this:
    heading: "Spenden & dieses Open-Access Projekt unterstützen"
    message: "Your support helps keep this project alive!"
    use_funding_yml: false
    platforms:
      ko_fi: "romanbartnik"
      buy_me_a_coffee: "roman.bartnik.th"
