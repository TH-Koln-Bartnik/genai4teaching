      D.zeilen.forEach((z, j) => { if (t >= z.start - 0.05 && t < z.ende + 0.25) i = j; });
      if (i === aktiv) return;
      if (aktiv >= 0) { knoepfe[aktiv].classList.remove('aktiv'); knoepfe[aktiv].removeAttribute('aria-current'); }
      aktiv = i;
      if (i < 0) return;
      const k = knoepfe[i];
      k.classList.add('aktiv'); k.setAttribute('aria-current', 'true');
      // nur innerhalb der Liste scrollen, nie die Buchseite; vorige Zeile bleibt sichtbar
      const li = k.parentElement, top = li.offsetTop - liste.offsetTop;
      if (top < liste.scrollTop || top + k.offsetHeight > liste.scrollTop + liste.clientHeight) {
        const vor = li.previousElementSibling;
        liste.scrollTop = vor ? vor.offsetTop - liste.offsetTop : 0;
      }
    }
  })();

  // ---------- Phase 3: Prüfen ----------
  (function () {
    const s = seiten[2];
    s.append(el('h2', { id: 'ph2', tabindex: '-1' }, '3 Prüfen Sie drei Aussagen'),
      el('p', {}, D.pruefeinleitung));
    D.pruefung.forEach((a, n) => {
      const key = 'a' + a.nr;
      const box = el('article', { class: 'aussage', 'aria-labelledby': 'aus-' + a.nr });
      const hoerText = 'Stelle anhören (' + mmss(a.start) + ')';
      const hoer = el('button', { type: 'button', 'aria-pressed': 'false' }, hoerText);
      hoer.addEventListener('click', () => {
        if (!audio.paused && stopBei === a.ende) { audio.pause(); return; }
        audio.currentTime = a.start; stopBei = a.ende; aktiverHoer = hoer; audio.play();
      });
      hoerKnoepfe.push([hoer, hoerText]);
      box.append(el('h3', { id: 'aus-' + a.nr, style: 'margin:0 0 6px;font-size:15px' }, 'Aussage ' + a.nr + ' (' + D.sprecher[a.sprecher] + ')'),
        el('blockquote', {}, a.aussage), el('p', {}, hoer),
        a.hinweis ? el('p', { class: 'klein' }, a.hinweis) : null,
        el('p', { class: 'klein', style: 'margin-bottom:4px' }, 'Originalstellen aus den Interviews (englisch; darunter Arbeitsübersetzung):'),
        el('ul', { class: 'stellen' }, a.stellen.map(st => el('li', {},
          el('span', { class: 'en', lang: 'en' }, '„' + st.en + '“'), el('span', { class: 'de' }, st.de),
          el('span', { class: 'id' }, 'Transkript ' + st.id)))));
      const fsU = el('fieldset', {}, el('legend', {}, 'Ihr Urteil'),
        el('div', { class: 'wahl' }, URTEILE.map(([id, txt]) => el('label', {}, el('input', { type: 'radio', name: key + '-u', value: id }), txt))));
      const fsS = el('fieldset', {}, el('legend', {}, 'Wie sicher sind Sie?'),
        el('div', { class: 'wahl' }, [[1, 'geraten'], [2, 'eher sicher'], [3, 'sicher']].map(([v, t]) =>
          el('label', {}, el('input', { type: 'radio', name: key + '-s', value: v }), v + ' ' + t))));
      const ab = el('button', { type: 'button', class: 'haupt', disabled: true }, 'Urteil abgeben');
      const live = el('div', { 'aria-live': 'polite' });
      box.append(fsU, fsS, ab, live);
      s.append(box);
      const pruefe = () => { ab.disabled = !(box.querySelector('input[name="' + key + '-u"]:checked') && box.querySelector('input[name="' + key + '-s"]:checked')); };
      box.addEventListener('change', pruefe);
      ab.addEventListener('click', () => {
        const u = box.querySelector('input[name="' + key + '-u"]:checked').value;
        const si = Number(box.querySelector('input[name="' + key + '-s"]:checked').value);
        Z.urteile[a.nr] = { u, si };
        box.querySelectorAll('input').forEach(x => { x.disabled = true; });
        ab.hidden = true;
        const gleich = u === a.urteil;
        live.replaceChildren(el('div', { class: 'aufloesung' },
          el('p', {}, el('span', { class: 'marke' }, gleich ? 'gleiches Urteil' : 'anderes Urteil'),
            'Prüfagent: ', el('span', { class: 'urteil-b' }, urteilText(a.urteil)), '. Sie: ', urteilText(u), ' (Sicherheit ' + si + ').'),
          el('p', {}, a.begruendung)));
        aktualisiereBilanz();
      });
    });
    s.append(navzeile(2, 'Weiter zur Bilanz'));
  })();

  // ---------- Phase 4: Bilanz ----------
  const bilanzInhalt = el('div');
  (function () {
    const s = seiten[3], V = D.vorhersage, B = D.bilanz;
    s.append(el('h2', { id: 'ph3', tabindex: '-1' }, '4 Bilanz'), bilanzInhalt,
      el('div', { class: 'kasten' }, el('h3', {}, 'Was diese Daten zeigen – und was nicht'),
        el('ul', {}, B.grenzen.map(g => el('li', {}, g)))),
      el('p', { class: 'klein' }, 'Quelle: ', el('a', { href: D.meta.bericht.href, target: '_blank', rel: 'noopener' }, D.meta.bericht.text),
        '; Datensatz: ', el('a', { href: D.meta.quelle.href, target: '_blank', rel: 'noopener' }, D.meta.quelle.text), '.'),
      navzeile(3, 'Weiter: Für Ihre Lehre'));
  })();
  function aktualisiereBilanz() {
    const V = D.vorhersage, B = D.bilanz;
    const zeilen = D.pruefung.map(a => {
      const m = Z.urteile[a.nr];
      return el('tr', {}, el('td', {}, 'Aussage ' + a.nr), el('td', {}, m ? urteilText(m.u) + ' (' + m.si + ')' : '–'),
        el('td', {}, urteilText(a.urteil)));
    });
    const treffer = D.pruefung.filter(a => Z.urteile[a.nr] && Z.urteile[a.nr].u === a.urteil).length;
    const geurteilt = Object.keys(Z.urteile).length;
    const opt = V.optionen.map(o => el('tr', {},
      el('td', {}, o.label + (Z.wahl === o.id ? ' (Ihre Wahl)' : '')),
      el('td', { style: 'width:45%' }, el('div', { class: 'balken', role: 'img', 'aria-label': o.zahl + ' von ' + V.n + ' Interviews' },
        el('span', { style: 'width:' + (100 * o.zahl / V.n).toFixed(1) + '%' }))),
      el('td', { style: 'white-space:nowrap' }, o.zahl + ' von ' + V.n)));
    const r = V.regler;
    bilanzInhalt.replaceChildren(
      el('p', {}, geurteilt ? 'Bei ' + treffer + ' von ' + geurteilt + ' Aussagen kamen Sie zum selben Urteil wie der Prüfagent.' : 'Sie haben noch keine Aussage beurteilt.'),
      el('table', {}, el('thead', {}, el('tr', {}, el('th', {}, 'Aussage'), el('th', {}, 'Ihr Urteil (Sicherheit)'), el('th', {}, 'Prüfagent'))), el('tbody', {}, zeilen)),
      el('p', {}, B.befund),
      el('h3', { style: 'margin:14px 0 6px;font-size:15px' }, 'Ihre Vorhersage gegen die Stichwortzählung'),
      el('p', { class: 'klein' }, V.zaehlhinweis),
      el('table', {}, el('thead', {}, el('tr', {}, el('th', {}, 'Thema'), el('th', {}, 'Interviews mit Stichwort'), el('th', {}, 'Zahl'))), el('tbody', {}, opt)),
      el('p', {}, r.frage_kurz + ': Sie schätzten ' + (Z.reglerBewegt ? Z.regler + ' %' : '(keine Schätzung)') + ', die Stichwortzählung ergibt ' +
        r.zahl + ' von ' + V.n + ' Interviews (' + pz(r.zahl / V.n) + ').'),
      el('div', { class: 'balken', role: 'img', 'aria-label': 'Zählung ' + pz(r.zahl / V.n) + (Z.reglerBewegt ? ', Ihre Schätzung ' + Z.regler + ' Prozent' : ''), style: 'max-width:420px;margin:0 0 6px' },
        el('span', { style: 'width:' + (100 * r.zahl / V.n).toFixed(1) + '%' }),
        Z.reglerBewegt ? el('span', { class: 'ich', style: 'width:' + Z.regler + '%' }) : null),
      el('p', { class: 'klein' }, 'Graue Fläche: Zählung. ' + (Z.reglerBewegt ? 'Senkrechter Strich: Ihre Schätzung. ' : '') + r.hinweis)
    );
  }
  aktualisiereBilanz();

  // ---------- Phase 5: Transfer ----------
  (function () {
    const s = seiten[4], T = D.transfer;
    const status = el('p', { class: 'status', 'aria-live': 'polite' });
    const kopier = el('button', { type: 'button' }, 'Vorlage kopieren');
    kopier.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(T.vorlage); status.textContent = 'Vorlage kopiert.'; }
      catch (e) {
        const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
        status.textContent = 'Kopieren nicht erlaubt: Text ist markiert, bitte mit Strg+C kopieren.';
      }
    });
    const pre = el('pre', { class: 'vorlage' }, T.vorlage);
    s.append(el('h2', { id: 'ph4', tabindex: '-1' }, '5 Für Ihre Lehre: eigene Freitexte zusammenfassen und prüfen'),
      el('p', {}, T.einleitung), pre, el('div', { class: 'navzeile', style: 'margin-top:0' }, kopier), status,
      el('p', {}, T.notebook),
      el('p', { class: 'klein' }, T.datenschutz),
      el('details', {}, el('summary', {}, 'So entstand dieses Hörstück: Prompt und gefundene Schwächen'),
        el('p', {}, T.makingof),
        el('p', { class: 'klein', style: 'margin-bottom:4px' }, T.prompttitel),
        el('pre', { class: 'vorlage' }, T.prompt),
        el('ul', { class: 'schwaechen' }, T.entstehung.map(x => el('li', {}, x))),
        el('p', { class: 'klein', style: 'margin-bottom:4px' }, 'Was der Prüfagent fand:'),
        el('ul', { class: 'schwaechen' }, T.schwaechen.map(x => el('li', {}, x)))),
      navzeile(4));
  })();

  // Phasenwechsel
  function zeige(i, nutzer) {
    if (nutzer) audio.pause();
    seiten.forEach((s, j) => { s.hidden = j !== i; });
    [...leiste.children].forEach((li, j) => { if (j === i) li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current'); });
    Z.phase = i;
    if (i === 3) aktualisiereBilanz();
    const h = document.getElementById('ph' + i);
    if (h && nutzer) h.focus({ preventScroll: true });
    if (nutzer) try { if (parent !== window) parent.postMessage({ typ: 'rahmen-anfang', id: 'podcast-forschende-ki' }, '*'); } catch (e) {}
    melde();
  }
  zeige(0);

  // Inhaltshöhe an die Kapitelseite melden (gleiches Protokoll wie agenten-engpass.html)
  function melde() {
    const b = document.body, cs = getComputedStyle(b);
    const h = Math.ceil(b.getBoundingClientRect().height + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom));
    try { if (parent !== window) parent.postMessage({ typ: 'rahmen-hoehe', id: 'podcast-forschende-ki-notebook', h: h }, '*'); } catch (e) {}
  }
  if (window.ResizeObserver) new ResizeObserver(melde).observe(document.body);
  window.addEventListener('load', melde);
})();
</script>
</body>
