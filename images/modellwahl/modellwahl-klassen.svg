<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Vier Modellklassen nach Leistung und Kontrolle über die Daten</title><rect width="1000" height="620" fill="#ffffff"/><defs><marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/></marker><marker id="achse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs><line x1="130" y1="548" x2="950" y2="548" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#achse)"/><text x="130" y="574" font-size="16" font-weight="400" fill="#6b6b6b" text-anchor="start" >kleiner</text><text x="950" y="574" font-size="16" font-weight="400" fill="#6b6b6b" text-anchor="end" >größer</text><text x="540" y="600" font-size="17" font-weight="650" fill="#1b1b1b" text-anchor="middle" >Leistung des Modells</text><line x1="112" y1="530" x2="112" y2="30" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#achse)"/><text x="90" y="530" font-size="16" font-weight="400" fill="#6b6b6b" text-anchor="start" transform="rotate(-90 90 530)">beim Anbieter</text><text x="90" y="30" font-size="16" font-weight="400" fill="#6b6b6b" text-anchor="end" transform="rotate(-90 90 30)">in eigener Hand</text><text x="64" y="280" font-size="17" font-weight="650" fill="#1b1b1b" text-anchor="middle" transform="rotate(-90 64 280)">Kontrolle über die Daten</text><rect x="144" y="44" width="382" height="222" rx="10" fill="#efefef" stroke="#d9d9d9" stroke-width="1.5"/><text x="335" y="142" font-size="21" font-weight="700" fill="#1b1b1b" text-anchor="middle" >Kleines offenes Modell</text><text x="335" y="170" font-size="16" font-weight="400" fill="#6b6b6b" text-anchor="middle" >läuft auf dem eigenen Rechner</text><rect x="554" y="44" width="382" height="222" rx="10" fill="#efefef" stroke="#d9d9d9" stroke-width="1.5"/><text x="745" y="142" font-size="21" font-weight="700" fill="#1b1b1b" text-anchor="middle" >Großes offenes Modell</text><text x="745" y="170" font-size="16" font-weight="400" fill="#6b6b6b" text-anchor="middle" >auf Servern der Hochschule oder des Landes</text><rect x="144" y="294" width="382" height="222" rx="10" fill="#efefef" stroke="#d9d9d9" stroke-width="1.5"/><text x="335" y="392" font-size="21" font-weight="700" fill="#1b1b1b" text-anchor="middle" >Kleines Frontier-Modell</text><text x="335" y="420" font-size="16" font-weight="400" fill="#6b6b6b" text-anchor="middle" >Mini- oder Flash-Variante, oft kostenlos</text><rect x="554" y="294" width="382" height="222" rx="10" fill="#e2e2e2" stroke="#1b1b1b" stroke-width="1.5"/><text x="745" y="392" font-size="21" font-weight="700" fill="#1b1b1b" text-anchor="middle" >Großes Frontier-Modell</text><text x="745" y="420" font-size="16" font-weight="400" fill="#6b6b6b" text-anchor="middle" >Spitzenmodell in der Cloud des Anbieters</text><line x1="805" y1="324" x2="805" y2="236" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#pfeil)"/><text x="819" y="286" font-size="17" font-weight="650" fill="#1b1b1b" text-anchor="start" >≈ 4 Monate später</text><line x1="594" y1="334" x2="476" y2="226" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#pfeil)"/><text x="500" y="286" font-size="17" font-weight="650" fill="#1b1b1b" text-anchor="end" >≈ 6–12 Monate später</text></svg>
