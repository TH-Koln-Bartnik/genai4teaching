<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" class="lernpfade-karte" role="img" aria-labelledby="lp-titel lp-desc">
<title id="lp-titel">Lernpfade durch das Buch</title>
<desc id="lp-desc">Liniennetz mit vier Lernpfaden. Alle Linien halten an Kapitel 1, Abschnitt 3.5, Kapitel 4 und Kapitel 6. Linie 1 hält an allen Hauptkapiteln, Linie 2 liest aus Kapitel 2 nur Abschnitt 2.1, Linie 3 ersetzt Abschnitte 3.1 bis 3.4 und Kapitel 5 durch die Praxis-Primer, Linie 4 geht von der Einleitung direkt zur Evidenz und endet in den Anhängen C und D.</desc>

