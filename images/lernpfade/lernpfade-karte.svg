<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" class="lernpfade-karte" role="img" aria-labelledby="lp-titel lp-desc">
<title id="lp-titel">Lernpfade durch das Buch</title>
<desc id="lp-desc">Liniennetz mit vier Lernpfaden. Alle Linien halten an Kapitel 1, Abschnitt 4.5, Kapitel 6 und Kapitel 7. Linie 1 hält an allen Hauptkapiteln, Linie 2 überspringt Kapitel 2, Linie 3 überspringt die Abschnitte 4.1 bis 4.4, Linie 4 geht von der Einleitung direkt zur Evidenz und endet in der Prompt-Sammlung in Anhang A.</desc>

