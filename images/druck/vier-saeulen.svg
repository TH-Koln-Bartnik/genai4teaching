<!-- Abb. „Vier Säulen“ (Kapitel 5, @fig-gmeiner-pillars). Inhalt nach Bernhard Gmeiner (2025), CC BY-SA 4.0; eigene Darstellung. Erzeugt von scripts/druck-abbildungsrechte.py. -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Vier Säulen KI-resistenter Aufgabenstellungen</title>
<desc id="d">Vier Säulen nebeneinander: 01 Mündlichkeit, Austausch in Echtzeit; 02 Prozess, der Lernweg wird bewertet; 03 Kontext, spezifische nicht öffentliche Informationen; 04 Kollaboration, Gruppenarbeit und kreative Leistungen. Nach Gmeiner 2025, CC BY-SA 4.0.</desc>
<rect width="900" height="290" fill="#ffffff"/>
<rect x="20" y="20" width="205" height="250" rx="6" fill="#f2f2f2" stroke="#b5b5b5" stroke-width="1.5"/>
<rect x="20" y="20" width="205" height="8" fill="#b45309"/>
<text x="40" y="70" font-size="26" fill="#b45309" text-anchor="start" font-weight="bold">01</text>
<text x="40" y="112" font-size="21" fill="#1b1b1b" text-anchor="start" font-weight="bold">Mündlichkeit</text>
<text x="40" y="165" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Aufgaben verlangen</text>
<text x="40" y="191" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Austausch in Echtzeit,</text>
<text x="40" y="217" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">etwa im Gespräch</text>
<rect x="240" y="20" width="205" height="250" rx="6" fill="#f2f2f2" stroke="#b5b5b5" stroke-width="1.5"/>
<rect x="240" y="20" width="205" height="8" fill="#b45309"/>
<text x="260" y="70" font-size="26" fill="#b45309" text-anchor="start" font-weight="bold">02</text>
<text x="260" y="112" font-size="21" fill="#1b1b1b" text-anchor="start" font-weight="bold">Prozess</text>
<text x="260" y="165" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Bewertet wird auch</text>
<text x="260" y="191" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">der Lernweg, etwa</text>
<text x="260" y="217" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Recherche, Reflexion</text>
<rect x="460" y="20" width="205" height="250" rx="6" fill="#f2f2f2" stroke="#b5b5b5" stroke-width="1.5"/>
<rect x="460" y="20" width="205" height="8" fill="#b45309"/>
<text x="480" y="70" font-size="26" fill="#b45309" text-anchor="start" font-weight="bold">03</text>
<text x="480" y="112" font-size="21" fill="#1b1b1b" text-anchor="start" font-weight="bold">Kontext</text>
<text x="480" y="165" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Aufgaben beziehen sich</text>
<text x="480" y="191" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">auf spezifische, nicht</text>
<text x="480" y="217" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">öffentliche Quellen</text>
<rect x="680" y="20" width="205" height="250" rx="6" fill="#f2f2f2" stroke="#b5b5b5" stroke-width="1.5"/>
<rect x="680" y="20" width="205" height="8" fill="#b45309"/>
<text x="700" y="70" font-size="26" fill="#b45309" text-anchor="start" font-weight="bold">04</text>
<text x="700" y="112" font-size="21" fill="#1b1b1b" text-anchor="start" font-weight="bold">Kollaboration</text>
<text x="700" y="165" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Gruppenarbeit und</text>
<text x="700" y="191" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">kreative Leistungen</text>
<text x="700" y="217" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">stehen im Vordergrund</text>
</svg>
