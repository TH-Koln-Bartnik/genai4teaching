<text x="507" y="30" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Mit Unternehmen kooperieren (Programme, Praktika)</text>
<text x="495" y="60" font-size="14" fill="#767676" text-anchor="end" font-weight="normal">15</text>
<text x="507" y="60" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">In Gremien der Hochschule mitarbeiten</text>
<rect x="465" y="70" width="430" height="30" fill="#f2f2f2"/>
<text x="495" y="90" font-size="14" fill="#767676" text-anchor="end" font-weight="normal">16</text>
<text x="507" y="90" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Lehrmaterial und Lehrbücher auswählen</text>
<text x="495" y="120" font-size="14" fill="#767676" text-anchor="end" font-weight="normal">17</text>
<text x="507" y="120" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Literaturlisten zusammenstellen</text>
<rect x="465" y="130" width="430" height="30" fill="#f2f2f2"/>
<text x="495" y="150" font-size="14" fill="#767676" text-anchor="end" font-weight="normal">18</text>
<text x="507" y="150" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">An Veranstaltungen teilnehmen (Campus, Region)</text>
