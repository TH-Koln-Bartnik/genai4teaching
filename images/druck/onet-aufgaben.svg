<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">25 Aufgaben von Lehrenden an Hochschulen am Beispiel Business Teachers, Postsecondary</title>
<desc id="d">Nummerierte Liste in zwei Spalten: 1 Vorlesungen vorbereiten und halten; 2 Studienleistungen bewerten und benoten; 3 Diskussionen anregen und moderieren; 4 Kursmaterial erstellen (Syllabus, Übungen, Handouts); 5 Fachlich auf dem Laufenden bleiben; 6 Curricula und Kursinhalte planen und überarbeiten; 7 Anwesenheit, Noten und Akten führen; 8 Forschen und publizieren; 9 Prüfungen erstellen, durchführen und bewerten; 10 Sprechstunden anbieten; 11 Mit dem Kollegium zusammenarbeiten; 12 Zu Studium und Berufsweg beraten; 13 Kurswebseiten erstellen und pflegen; 14 Mit Unternehmen kooperieren (Programme, Praktika); 15 In Gremien der Hochschule mitarbeiten; 16 Lehrmaterial und Lehrbücher auswählen; 17 Literaturlisten zusammenstellen; 18 An Veranstaltungen teilnehmen (Campus, Region); 19 Neue Kolleginnen und Kollegen betreuen; 20 Verwaltungsaufgaben übernehmen, etwa im Dekanat; 21 Bei Studierendengewinnung und Vermittlung mitwirken; 22 Studentische Organisationen beraten; 23 Abschluss-, Praxis- und Forschungsarbeiten betreuen; 24 Unternehmen und Behörden beraten; 25 Forschungsanträge schreiben. Quelle: O*NET OnLine, CC BY 4.0, übersetzt und gekürzt.</desc>
<rect width="900" height="440" fill="#ffffff"/>
<rect x="20" y="10" width="430" height="30" fill="#f2f2f2"/>
<text x="50" y="30" font-size="14" fill="#767676" text-anchor="end" font-weight="normal">1</text>
<text x="62" y="30" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Vorlesungen vorbereiten und halten</text>
<text x="50" y="60" font-size="14" fill="#767676" text-anchor="end" font-weight="normal">2</text>
<text x="62" y="60" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Studienleistungen bewerten und benoten</text>
<rect x="20" y="70" width="430" height="30" fill="#f2f2f2"/>
<text x="50" y="90" font-size="14" fill="#767676" text-anchor="end" font-weight="normal">3</text>
<text x="62" y="90" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Diskussionen anregen und moderieren</text>
<text x="50" y="120" font-size="14" fill="#767676" text-anchor="end" font-weight="normal">4</text>
<text x="62" y="120" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Kursmaterial erstellen (Syllabus, Übungen, Handouts)</text>
<rect x="20" y="130" width="430" height="30" fill="#f2f2f2"/>
<text x="50" y="150" font-size="14" fill="#767676" text-anchor="end" font-weight="normal">5</text>
<text x="62" y="150" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Fachlich auf dem Laufenden bleiben</text>
<text x="50" y="180" font-size="14" fill="#767676" text-anchor="end" font-weight="normal">6</text>
<text x="62" y="180" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Curricula und Kursinhalte planen und überarbeiten</text>
<rect x="20" y="190" width="430" height="30" fill="#f2f2f2"/>
<text x="50" y="210" font-size="14" fill="#767676" text-anchor="end" font-weight="normal">7</text>
<text x="62" y="210" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Anwesenheit, Noten und Akten führen</text>
