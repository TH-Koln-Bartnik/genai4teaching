<text x="495" y="210" font-size="14" fill="#767676" text-anchor="end" font-weight="normal">20</text>
<text x="507" y="210" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Verwaltungsaufgaben übernehmen, etwa im Dekanat</text>
<text x="495" y="240" font-size="14" fill="#767676" text-anchor="end" font-weight="normal">21</text>
<text x="507" y="240" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Bei Studierendengewinnung und Vermittlung mitwirken</text>
<rect x="465" y="250" width="430" height="30" fill="#f2f2f2"/>
<text x="495" y="270" font-size="14" fill="#767676" text-anchor="end" font-weight="normal">22</text>
<text x="507" y="270" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Studentische Organisationen beraten</text>
<text x="495" y="300" font-size="14" fill="#767676" text-anchor="end" font-weight="normal">23</text>
<text x="507" y="300" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Abschluss-, Praxis- und Forschungsarbeiten betreuen</text>
<rect x="465" y="310" width="430" height="30" fill="#f2f2f2"/>
<text x="495" y="330" font-size="14" fill="#767676" text-anchor="end" font-weight="normal">24</text>
<text x="507" y="330" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Unternehmen und Behörden beraten</text>
