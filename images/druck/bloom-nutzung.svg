<!-- Abb. „Bloom-Nutzung“ (Kapitel 1, @fig-llm-nutzung-bloom). Daten: Handa et al. (2025); eigene Darstellung. Erzeugt von scripts/druck-abbildungsrechte.py. -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Nutzung eines Sprachmodells durch Studierende nach Stufen der Bloomschen Taxonomie</title>
<desc id="d">Balkendiagramm, sechs Stufen von oben nach unten: Erschaffen 39,8 %, Bewerten 5,5 %, Analysieren 30,2 %, Anwenden 10,9 %, Verstehen 10,0 %, Erinnern 1,8 %. Die drei höheren Stufen zusammen 75,5 %, die drei niedrigeren 22,7 %. Daten: Handa et al. 2025.</desc>
<rect width="900" height="440" fill="#ffffff"/>
<text x="90" y="60" font-size="19" fill="#1b1b1b" text-anchor="start" font-weight="bold">Erschaffen</text>
<text x="90" y="82" font-size="14" fill="#767676" text-anchor="start" font-weight="normal">Aus Gelerntem etwas Neues bauen</text>
<rect x="380" y="46" width="417.9" height="36" fill="#b45309"/>
<text x="807.9" y="71" font-size="17" fill="#b45309" text-anchor="start" font-weight="bold">39,8 %</text>
<text x="90" y="118" font-size="19" fill="#1b1b1b" text-anchor="start" font-weight="bold">Bewerten</text>
<text x="90" y="140" font-size="14" fill="#767676" text-anchor="start" font-weight="normal">Urteilen und das Urteil begründen</text>
<rect x="380" y="104" width="57.8" height="36" fill="#b45309"/>
<text x="447.75" y="129" font-size="17" fill="#b45309" text-anchor="start" font-weight="bold">5,5 %</text>
<text x="90" y="176" font-size="19" fill="#1b1b1b" text-anchor="start" font-weight="bold">Analysieren</text>
<text x="90" y="198" font-size="14" fill="#767676" text-anchor="start" font-weight="normal">Zerlegen, Zusammenhänge erkennen</text>
<rect x="380" y="162" width="317.1" height="36" fill="#b45309"/>
<text x="707.0999999999999" y="187" font-size="17" fill="#b45309" text-anchor="start" font-weight="bold">30,2 %</text>
<text x="90" y="234" font-size="19" fill="#1b1b1b" text-anchor="start" font-weight="bold">Anwenden</text>
<text x="90" y="256" font-size="14" fill="#767676" text-anchor="start" font-weight="normal">Gelerntes auf neue Fälle übertragen</text>
<rect x="380" y="220" width="114.5" height="36" fill="#b5b5b5"/>
<text x="504.45" y="245" font-size="17" fill="#1b1b1b" text-anchor="start" font-weight="normal">10,9 %</text>
<text x="90" y="292" font-size="19" fill="#1b1b1b" text-anchor="start" font-weight="bold">Verstehen</text>
<text x="90" y="314" font-size="14" fill="#767676" text-anchor="start" font-weight="normal">Bedeutung erfassen und erklären</text>
<rect x="380" y="278" width="105.0" height="36" fill="#b5b5b5"/>
<text x="495.0" y="303" font-size="17" fill="#1b1b1b" text-anchor="start" font-weight="normal">10,0 %</text>
<text x="90" y="350" font-size="19" fill="#1b1b1b" text-anchor="start" font-weight="bold">Erinnern</text>
<text x="90" y="372" font-size="14" fill="#767676" text-anchor="start" font-weight="normal">Fakten abrufen</text>
<rect x="380" y="336" width="18.9" height="36" fill="#b5b5b5"/>
<text x="408.9" y="361" font-size="17" fill="#1b1b1b" text-anchor="start" font-weight="normal">1,8 %</text>
<path d="M74 46 H60 V204 H74" fill="none" stroke="#b45309" stroke-width="2"/>
<text transform="translate(50 125.0) rotate(-90)" font-size="14" fill="#b45309" text-anchor="middle">höhere Stufen 75,5 %</text>
<path d="M74 220 H60 V378 H74" fill="none" stroke="#767676" stroke-width="2"/>
<text transform="translate(50 299.0) rotate(-90)" font-size="14" fill="#767676" text-anchor="middle">niedrigere Stufen 22,7 %</text>
<text x="380" y="416" font-size="14" fill="#767676" text-anchor="start" font-weight="normal">Anteil der Gespräche, in denen das Modell diese Denkleistung zeigt</text>
</svg>
