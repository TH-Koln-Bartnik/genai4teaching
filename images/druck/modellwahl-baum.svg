<text x="628" y="38" font-weight="bold">Hochschulzugang</text>
<text x="628" y="62" >oder kleines offenes Modell</text>
<text x="628" y="84" >auf dem eigenen Rechner</text>
<line x1="46" y1="94" x2="46" y2="128" stroke="#1b1b1b" stroke-width="2"/>
<text x="56" y="116" fill="#767676" font-size="15">nein</text>
<text x="20" y="152" font-weight="bold" fill="#767676" font-size="15">2  Aufgabe: Ich will …</text>
<text x="455" y="152" fill="#767676" font-size="15">Modellklasse</text>
<text x="860" y="152" fill="#767676" font-size="15" text-anchor="end">Stufe</text>
<rect x="20" y="166" width="860" height="44" fill="#f2f2f2"/>
<text x="28" y="194" >… eine Frage klären, einen Text überarbeiten</text>
<text x="455" y="194" >kleines Frontier-Modell</text>
<text x="860" y="194" text-anchor="end" font-weight="bold">0 €</text>
<rect x="20" y="210" width="860" height="44" fill="#fff"/>
<text x="28" y="238" >… ein Bild erstellen (Diagramme besser als Code)</text>
<text x="455" y="238" >Frontier-Modell mit Bildgenerator</text>
<text x="860" y="238" text-anchor="end" font-weight="bold">0 €</text>
<rect x="20" y="254" width="860" height="44" fill="#f2f2f2"/>
<text x="28" y="282" >… eine Lerneinheit, Folien, Aufgaben erstellen</text>
<text x="455" y="282" >großes Frontier-Modell, hohe Denkstufe</text>
<text x="860" y="282" text-anchor="end" font-weight="bold">20 €</text>
<rect x="20" y="298" width="860" height="44" fill="#fff"/>
<text x="28" y="326" >… regelmäßig recherchieren</text>
<text x="455" y="326" >großes Frontier-Modell mit Recherche-Agent</text>
<text x="860" y="326" text-anchor="end" font-weight="bold">20 €</text>
<rect x="20" y="342" width="860" height="44" fill="#f2f2f2"/>
<text x="28" y="370" >… ein Werkzeug bauen (Simulation, Lernspiel)</text>
<text x="455" y="370" >großes Frontier-Modell im Agentenmodus</text>
<text x="860" y="370" text-anchor="end" font-weight="bold">20 €</text>
<rect x="20" y="386" width="860" height="44" fill="#fff"/>
<text x="28" y="414" >… einen Tutor für Studierende betreiben</text>
<text x="455" y="414" >API (nach Verbrauch) oder Hochschule</text>
<text x="860" y="414" text-anchor="end" font-weight="bold">kein Abo</text>
<line x1="20" y1="430" x2="880" y2="430" stroke="#b5b5b5" stroke-width="1.5"/>
<text x="20" y="466" font-weight="bold" fill="#767676" font-size="15">3  Häufigkeit</text>
<text x="150" y="466" >Täglich, auch mit langen Agentenläufen?</text>
<text x="150" y="490" >Dann eine Stufe höher: 0 → 20 €, 20 → 100 €.</text>
<rect x="20" y="516" width="640" height="96" fill="#f2f2f2"/>
<rect x="20" y="516" width="6" height="96" fill="#b45309"/>
<text x="42" y="546" font-weight="bold" fill="#b45309">Prüfregel</text>
<text x="42" y="572" >Muss das Ergebnis stimmen und können Sie es nicht selbst prüfen?</text>
<text x="42" y="596" >Größtes Modell, höchste Denkstufe, und ein Mensch prüft.</text>
