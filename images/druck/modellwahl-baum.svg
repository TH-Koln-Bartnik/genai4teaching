<text x="38" y="40" font-weight="bold" fill="#767676" font-size="15">1  Daten</text>
<text x="38" y="64" >Personenbezogene Daten, Prüfungsleistungen</text>
<text x="38" y="86" >oder unveröffentlichte Forschung?</text>
<line x1="580" y1="52" x2="612" y2="52" stroke="#1b1b1b" stroke-width="2"/>
<text x="588" y="44" fill="#767676" font-size="15">ja</text>
