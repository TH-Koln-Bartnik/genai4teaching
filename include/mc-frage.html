<!-- Einstiegsfragen als Multiple Choice (Gegenstück zu _filters/mc-frage.lua).
     Zeigt die Fragen eines Kastens einzeln; nach der ersten Wahl erscheinen
     Bewertung und Auflösung. Ohne JavaScript bleibt die Liste lesbar. -->
<style>
.mc-frage { margin: 0.4rem 0 0.2rem; }
.mc-frage > p:first-child { font-weight: 600; margin-bottom: 0.6rem; }
.mc-js .mc-frage[hidden] { display: none; }
.mc-optionen { display: flex; flex-direction: column; gap: 0.45rem; margin: 0 0 0.6rem; }
.mc-option {
  text-align: left; width: 100%; padding: 0.55rem 0.8rem;
  border: 1px solid var(--bs-border-color, #ccc); border-radius: 6px;
  background: var(--bs-body-bg, #fff); color: var(--bs-body-color, #222);
  font: inherit; line-height: 1.4; cursor: pointer;
  display: flex; gap: 0.6rem; align-items: flex-start;
}
.mc-option:hover:not([disabled]) { border-color: #c81e0f; }
.mc-option:focus-visible { outline: 2px solid #c81e0f; outline-offset: 2px; }
.mc-option[disabled] { cursor: default; }
.mc-option .mc-buchstabe { font-weight: 600; min-width: 1.4em; color: #6c757d; }
.mc-option p { margin: 0; }
.mc-option.mc-ist-richtig { border: 2px solid #2e7d32; }
.mc-option.mc-ist-falsch { border: 2px solid #c81e0f; }
.mc-option.mc-ist-richtig .mc-buchstabe::after { content: " ✓"; color: #2e7d32; }
.mc-option.mc-ist-falsch .mc-buchstabe::after { content: " ✗"; color: #c81e0f; }
.mc-option.mc-nicht-gewaehlt { opacity: 0.6; }
.mc-rueckmeldung { border-left: 3px solid #6c757d; padding: 0.3rem 0 0.3rem 0.8rem; margin-top: 0.4rem; }
.mc-js .mc-rueckmeldung[hidden] { display: none; }
.mc-rueckmeldung p:last-child { margin-bottom: 0; }
.mc-urteil { font-weight: 600; }
.mc-navi { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.8rem; flex-wrap: wrap; }
.mc-navi button {
  font: inherit; font-size: 0.9em; padding: 0.25rem 0.8rem; border-radius: 6px;
  border: 1px solid var(--bs-border-color, #ccc); background: var(--bs-body-bg, #fff);
  color: var(--bs-body-color, #222); cursor: pointer;
}
.mc-navi button[disabled] { opacity: 0.4; cursor: default; }
.mc-navi .mc-stand { font-size: 0.9em; color: #6c757d; margin-right: auto; }
.mc-punkte { display: flex; gap: 0.3rem; }
.mc-punkte span { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--bs-border-color, #ccc); }
.mc-punkte span.mc-aktuell { background: #c81e0f; }
</style>
<script>
(function () {
  "use strict";
  function init() {
    var fragen = Array.prototype.slice.call(document.querySelectorAll("div.mc-frage"));
    if (!fragen.length) return;
    var gruppen = new Map();
    fragen.forEach(function (f) {
      var box = f.closest(".callout") || f.parentElement;
      if (!gruppen.has(box)) gruppen.set(box, []);
      gruppen.get(box).push(f);
    });
    gruppen.forEach(function (liste, box) { baueGruppe(box, liste); });
  }

  function baueGruppe(box, liste) {
    box.classList.add("mc-js");
    var n = liste.length, aktuell = 0, beantwortet = 0;
    liste.forEach(function (f, i) { baueFrage(f, i, n, function () { beantwortet++; aktualisiere(); }); });

    var navi = document.createElement("div");
    navi.className = "mc-navi";
    var stand = document.createElement("span");
    stand.className = "mc-stand";
    stand.setAttribute("aria-live", "polite");
    var punkte = document.createElement("span");
    punkte.className = "mc-punkte";
    punkte.setAttribute("aria-hidden", "true");
    for (var p = 0; p < n; p++) punkte.appendChild(document.createElement("span"));
    var zurueck = document.createElement("button");
    zurueck.type = "button"; zurueck.textContent = "← Zurück";
    var weiter = document.createElement("button");
    weiter.type = "button"; weiter.textContent = "Weiter →";
    navi.appendChild(stand); navi.appendChild(punkte); navi.appendChild(zurueck); navi.appendChild(weiter);
    liste[n - 1].parentNode.insertBefore(navi, liste[n - 1].nextSibling);

    zurueck.addEventListener("click", function () { if (aktuell > 0) { aktuell--; aktualisiere(true); } });
    weiter.addEventListener("click", function () { if (aktuell < n - 1) { aktuell++; aktualisiere(true); } });

    function aktualisiere(fokus) {
      liste.forEach(function (f, i) { f.hidden = (i !== aktuell); });
      Array.prototype.forEach.call(punkte.children, function (s, i) { s.classList.toggle("mc-aktuell", i === aktuell); });
      stand.textContent = "Frage " + (aktuell + 1) + " von " + n +
        (beantwortet === n ? " · alle beantwortet, die Auflösung folgt im Kapitel" : "");
      zurueck.disabled = aktuell === 0;
      weiter.disabled = aktuell === n - 1;
      if (fokus) { var b = liste[aktuell].querySelector(".mc-option"); if (b && !b.disabled) b.focus(); }
    }
    aktualisiere(false);
  }

  function baueFrage(f, index, n, beimAntworten) {
    var ul = f.querySelector(":scope > ul");
    var rm = f.querySelector(":scope > .mc-rueckmeldung");
    if (!ul) return;
    var optionen = document.createElement("div");
    optionen.className = "mc-optionen";
    optionen.setAttribute("role", "group");
    var stamm = f.querySelector(":scope > p");
    if (stamm) {
      if (!stamm.id) stamm.id = "mc-stamm-" + Math.random().toString(36).slice(2, 9);
      optionen.setAttribute("aria-labelledby", stamm.id);
    }
    var knoepfe = [];
    Array.prototype.forEach.call(ul.children, function (li, i) {
      var richtig = !!li.querySelector("span.richtig");
      var b = document.createElement("button");
      b.type = "button"; b.className = "mc-option";
      b.dataset.richtig = richtig ? "1" : "0";
      var bu = document.createElement("span");
      bu.className = "mc-buchstabe"; bu.textContent = String.fromCharCode(97 + i) + ")";
      var txt = document.createElement("span");
      txt.innerHTML = li.innerHTML;
      b.appendChild(bu); b.appendChild(txt);
      optionen.appendChild(b); knoepfe.push(b);
    });
    ul.replaceWith(optionen);
    if (rm) { rm.hidden = true; rm.setAttribute("aria-live", "polite"); }

    knoepfe.forEach(function (b) {
      b.addEventListener("click", function () {
        var treffer = b.dataset.richtig === "1";
        knoepfe.forEach(function (k) {
          k.disabled = true;
          if (k.dataset.richtig === "1") k.classList.add("mc-ist-richtig");
          else if (k === b) k.classList.add("mc-ist-falsch");
          else k.classList.add("mc-nicht-gewaehlt");
        });
        b.setAttribute("aria-pressed", "true");
        if (rm) {
          var urteil = document.createElement("span");
          urteil.className = "mc-urteil";
          urteil.textContent = treffer ? "Richtig geraten. " : "Nicht ganz – das überrascht viele. ";
          var erster = rm.querySelector("p") || rm;
          erster.insertBefore(urteil, erster.firstChild);
          rm.hidden = false;
        }
        beimAntworten();
      });
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
