     nach dem Stylesheet; bis dahin steht eine Ersatzschrift, und beim Wechsel springt
     der Text. Preconnect + direkter Stylesheet-Link verkürzen diese Phase. -->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&display=swap">
