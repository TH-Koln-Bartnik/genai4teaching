<?xml version="1.0" encoding="UTF-8"?>
<!-- Abb. „Was ein Abo kauft“ (Kapitel 2, @fig-abo-stufen). Graustufen + eine Akzentfarbe. Von Hand gepflegt. -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Was ein Abo kauft: mehr Kontingent, kaum ein klügeres Modell</title>
<desc id="d">Drei Stufen als Säulen. Kostenlos: gedeckelt. Rund 20 Euro: Kontingent 1-fach. Rund 100 Euro: etwa 5-fach. Ab 20 Euro arbeitet dasselbe große Modell mit hoher Denkstufe.</desc>
<rect width="900" height="510" fill="#ffffff"/>
<g fill="#1b1b1b" font-size="17">
  <!-- y-Achse -->
  <line x1="100" y1="380" x2="100" y2="48" stroke="#767676" stroke-width="2"/>
  <line x1="100" y1="380" x2="870" y2="380" stroke="#1b1b1b" stroke-width="2"/>
  <line x1="94" y1="316" x2="870" y2="316" stroke="#e4e4e4" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="88" y="322" text-anchor="end" fill="#767676">1×</text>
  <text x="88" y="66" text-anchor="end" fill="#767676">5×</text>
  <line x1="94" y1="60" x2="100" y2="60" stroke="#767676" stroke-width="2"/>
  <text transform="translate(40 214) rotate(-90)" text-anchor="middle" fill="#767676">Kontingent: Nachrichten und Agentenzeit</text>

  <!-- Säulen -->
  <rect x="125" y="364" width="215" height="16" fill="#b5b5b5"/>
  <rect x="385" y="316" width="215" height="64" fill="#b5b5b5"/>
  <rect x="645" y="60" width="215" height="320" fill="#e4e4e4" stroke="#b5b5b5" stroke-width="1.5"/>
  <rect x="645" y="316" width="215" height="64" fill="#b5b5b5"/>

  <!-- Stichworte -->
  <text x="232" y="296" text-anchor="middle" font-weight="bold">gedeckelt</text>
  <text x="232" y="324" text-anchor="middle">enge Grenzen</text>
  <text x="232" y="346" text-anchor="middle">risikoarme Einzelfragen</text>

  <text x="492" y="222" text-anchor="middle" font-weight="bold">1×</text>
  <text x="492" y="250" text-anchor="middle">Recherche-Agent</text>
  <text x="492" y="272" text-anchor="middle">Projekte und Dateien</text>
  <text x="492" y="294" text-anchor="middle">Agenten zum Ausprobieren</text>

  <text x="752" y="98" text-anchor="middle" font-weight="bold">ca. 5×</text>
  <text x="752" y="132" text-anchor="middle">lange Agentenläufe</text>
  <text x="752" y="154" text-anchor="middle">wiederkehrende,</text>
  <text x="752" y="176" text-anchor="middle">geplante Aufgaben</text>
  <text x="752" y="214" text-anchor="middle" fill="#767676">mehr Menge,</text>
  <text x="752" y="236" text-anchor="middle" fill="#767676">kaum mehr Klugheit</text>

  <!-- Stufen -->
  <g font-size="19">
    <text x="232" y="408" text-anchor="middle" font-weight="bold">kostenlos</text>
    <text x="492" y="408" text-anchor="middle" font-weight="bold">rund 20 € im Monat</text>
    <text x="752" y="408" text-anchor="middle" font-weight="bold">rund 100 € im Monat</text>
  </g>
  <text x="232" y="432" text-anchor="middle" fill="#767676">Ausprobieren</text>
  <text x="492" y="432" text-anchor="middle" fill="#767676">Gelegenheitsnutzung</text>
  <text x="752" y="432" text-anchor="middle" fill="#767676">professionelle Nutzung</text>

  <!-- Modellzeile -->
  <text x="20" y="490" fill="#767676">Modell</text>
  <text x="232" y="490" text-anchor="middle">klein oder automatisch gewählt</text>
  <path d="M392 456 v10 h461 v-10" fill="none" stroke="#b45309" stroke-width="3"/>
  <text x="622" y="490" text-anchor="middle" fill="#b45309" font-weight="bold">dasselbe große Modell mit hoher Denkstufe</text>
</g>
</svg>
