<?xml version="1.0" encoding="UTF-8"?>
<!-- Abb. „Interaktionsarten“ (Kapitel 5, @fig-interaction-types). Konzept nach Handa et al. (2025); eigene Darstellung und Beispiele. Erzeugt von scripts/druck-abbildungsrechte.py. -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Vier Arten der Interaktion von Studierenden mit Sprachmodellen</title>
<desc id="d">Zwei mal zwei Felder. Spalten: Problem lösen, Ergebnis erstellen. Zeilen: direkt, kollaborativ. 1 fertige Lösung oder Erklärung, 2 fertiges Material, 3 geführtes Problemlösen, 4 schrittweise Verbesserung der eigenen Arbeit. Die kollaborative Zeile ist hervorgehoben. Konzept nach Handa et al. 2025, Beispiele eigene.</desc>
<rect width="900" height="500" fill="#ffffff"/>
<text x="340.0" y="50" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold">Problem lösen</text>
<text x="700.0" y="50" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold">Ergebnis erstellen</text>
<text x="150" y="166.0" font-size="19" fill="#1b1b1b" text-anchor="end" font-weight="bold">direkt</text>
<rect x="170" y="70" width="340" height="180" rx="6" fill="#f2f2f2" stroke="#b5b5b5" stroke-width="1.5"/>
<circle cx="482" cy="98" r="15" fill="#767676"/>
<text x="482" y="104" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="190" y="106" font-size="15" fill="#767676" text-anchor="start" font-weight="normal">Studierende wollen …</text>
<text x="190" y="132" font-size="18" fill="#1b1b1b" text-anchor="start" font-weight="bold">eine fertige Lösung oder Erklärung</text>
<text x="190" y="182" font-size="13" fill="#767676" text-anchor="start" font-weight="normal">Beispiel</text>
<text x="190" y="206" font-size="16" fill="#1b1b1b" text-anchor="start" font-weight="normal">„Berechne den Break-even-Punkt</text>
<text x="190" y="228" font-size="16" fill="#1b1b1b" text-anchor="start" font-weight="normal">für diese Zahlen.“</text>
<rect x="530" y="70" width="340" height="180" rx="6" fill="#f2f2f2" stroke="#b5b5b5" stroke-width="1.5"/>
<circle cx="842" cy="98" r="15" fill="#767676"/>
<text x="842" y="104" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="550" y="106" font-size="15" fill="#767676" text-anchor="start" font-weight="normal">Studierende wollen …</text>
<text x="550" y="132" font-size="18" fill="#1b1b1b" text-anchor="start" font-weight="bold">fertiges Material</text>
<text x="550" y="182" font-size="13" fill="#767676" text-anchor="start" font-weight="normal">Beispiel</text>
<text x="550" y="206" font-size="16" fill="#1b1b1b" text-anchor="start" font-weight="normal">„Fasse diesen Fachartikel auf</text>
<text x="550" y="228" font-size="16" fill="#1b1b1b" text-anchor="start" font-weight="normal">einer Seite zusammen.“</text>
<text x="150" y="366.0" font-size="19" fill="#b45309" text-anchor="end" font-weight="bold">kollaborativ</text>
<rect x="170" y="270" width="340" height="180" rx="6" fill="#f2f2f2" stroke="#b45309" stroke-width="3"/>
<circle cx="482" cy="298" r="15" fill="#b45309"/>
<text x="482" y="304" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="190" y="306" font-size="15" fill="#767676" text-anchor="start" font-weight="normal">Studierende wollen …</text>
<text x="190" y="332" font-size="18" fill="#1b1b1b" text-anchor="start" font-weight="bold">geführt ein Problem lösen</text>
<text x="190" y="382" font-size="13" fill="#767676" text-anchor="start" font-weight="normal">Beispiel</text>
<text x="190" y="406" font-size="16" fill="#1b1b1b" text-anchor="start" font-weight="normal">„Führe mich durch die ABC-Analyse,</text>
<text x="190" y="428" font-size="16" fill="#1b1b1b" text-anchor="start" font-weight="normal">ohne die Lösung vorwegzunehmen.“</text>
<rect x="530" y="270" width="340" height="180" rx="6" fill="#f2f2f2" stroke="#b45309" stroke-width="3"/>
<circle cx="842" cy="298" r="15" fill="#b45309"/>
<text x="842" y="304" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="550" y="306" font-size="15" fill="#767676" text-anchor="start" font-weight="normal">Studierende wollen …</text>
<text x="550" y="332" font-size="18" fill="#1b1b1b" text-anchor="start" font-weight="bold">ihre Arbeit schrittweise verbessern</text>
<text x="550" y="382" font-size="13" fill="#767676" text-anchor="start" font-weight="normal">Beispiel</text>
<text x="550" y="406" font-size="16" fill="#1b1b1b" text-anchor="start" font-weight="normal">„Gib mir Rückmeldung zu meiner</text>
<text x="550" y="428" font-size="16" fill="#1b1b1b" text-anchor="start" font-weight="normal">Gliederung, ich überarbeite sie.“</text>
<text x="170" y="480" font-size="14" fill="#767676" text-anchor="start" font-weight="normal">Hervorgehoben: die Interaktionen, die Lehrende fördern wollen.</text>
</svg>
