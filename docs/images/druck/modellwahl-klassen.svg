<?xml version="1.0" encoding="UTF-8"?>
<!-- Abb. „Modellklassen“ (Kapitel 2, @fig-modellklassen). Graustufen + eine Akzentfarbe. Von Hand gepflegt. -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Vier Modellklassen nach Leistung und Kontrolle über die Daten</title>
<desc id="d">Zwei mal zwei Felder. Unten beim Anbieter: kleines und großes Frontier-Modell. Oben bei Hochschule oder eigenem Rechner: kleines offenes Modell lokal und großes offenes Modell gehostet. Offene Modelle liegen rund 4 Monate, Modelle für eine Grafikkarte 6 bis 12 Monate hinter der Frontier.</desc>
<rect width="900" height="490" fill="#ffffff"/>
<g fill="#1b1b1b" font-size="17">
  <!-- Achsen -->
  <text transform="translate(34 215) rotate(-90)" text-anchor="middle" fill="#767676">Kontrolle über die Daten</text>
  <text transform="translate(62 140) rotate(-90)" text-anchor="middle" fill="#767676">Hochschule, eigener Rechner</text>
  <text transform="translate(62 335) rotate(-90)" text-anchor="middle" fill="#767676">beim Anbieter</text>
  <text x="485" y="474" text-anchor="middle" fill="#767676">Leistung</text>
  <text x="290" y="444" text-anchor="middle" fill="#767676">← kleiner, schneller, billiger</text>
  <text x="680" y="444" text-anchor="middle" fill="#767676">größer, stärker →</text>

  <!-- Felder -->
  <rect x="90" y="20" width="385" height="220" rx="8" fill="#ffffff" stroke="#b5b5b5" stroke-width="2"/>
  <rect x="495" y="20" width="385" height="220" rx="8" fill="#ffffff" stroke="#b5b5b5" stroke-width="2"/>
  <rect x="90" y="260" width="385" height="150" rx="8" fill="#f2f2f2" stroke="#b5b5b5" stroke-width="2"/>
  <rect x="495" y="260" width="385" height="150" rx="8" fill="#f2f2f2" stroke="#1b1b1b" stroke-width="3"/>

  <g font-size="20" font-weight="bold">
    <text x="112" y="56">Kleines offenes Modell</text>
    <text x="517" y="56">Großes offenes Modell</text>
    <text x="112" y="296">Kleines Frontier-Modell</text>
    <text x="517" y="296">Großes Frontier-Modell</text>
  </g>
  <text x="112" y="88">läuft auf einer Grafikkarte</text>
  <text x="112" y="112">im eigenen Rechner</text>
  <text x="112" y="136">Daten bleiben im Haus</text>

  <text x="517" y="88">läuft auf Rechnern der</text>
  <text x="517" y="112">Hochschule oder des Landes</text>
  <text x="517" y="136">Daten bleiben im Hochschulnetz</text>

  <text x="112" y="328">Mini- und Flash-Varianten</text>
  <text x="112" y="352">Standard der Gratiszugänge</text>
  <text x="112" y="376">gut für Routine und Tempo</text>

  <text x="517" y="328">stärkste Variante, hohe Denkstufe</text>
  <text x="517" y="352">ab der 20-€-Stufe oder über</text>
  <text x="517" y="376">die API; Maßstab der Frontier</text>

  <!-- Zeitverzug -->
  <g fill="#b45309" font-weight="bold">
    <text x="112" y="196">Rückstand auf die Frontier:</text>
    <text x="112" y="220">6 bis 12 Monate</text>
    <text x="517" y="196">Rückstand auf die Frontier:</text>
    <text x="517" y="220">rund 4 Monate</text>
  </g>
</g>
</svg>
