<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galerie: Neun Praxisbeispiele, die mit generativer KI entstanden sind</title>
<link rel="stylesheet" href="scm-viz/scm-viz.css">
<style>
  /* Graustufen plus genau eine Akzentfarbe (TH-Rot): "das, worum es gerade geht" */
  :root { --grund:#ffffff; --tinte:#1b1b1b; --grau:#5f5f66; --linie:#d0d0d5; --akzent:#c81e0f; }
  @media (prefers-color-scheme: dark) {
    :root { --grund:#0d1117; --tinte:#e6edf3; --grau:#9aa4af; --linie:#30363d; --akzent:#ff6b5b; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--grund); color: var(--tinte);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .g { max-width: 1040px; margin: 0 auto; padding: 10px 12px 14px; }

  .g-head { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
    border-bottom: 2px solid var(--tinte); padding-bottom: 8px; margin-bottom: 10px; }
  .g-count { font-variant-numeric: tabular-nums; color: var(--grau); font-size: 13px; white-space: nowrap; }
  .g-title { margin: 0; font-size: clamp(16px, 2vw, 20px); font-weight: 650; line-height: 1.3; }
  .g-title small { display: block; font-weight: 400; color: var(--grau); font-size: 12.5px; margin-top: 2px; }
  .g-nav { display: flex; gap: 6px; }
  .g-nav button { width: 40px; height: 40px; border: 1px solid var(--grau); border-radius: 50%;
    background: var(--grund); color: var(--tinte); font-size: 20px; line-height: 1; cursor: pointer; }
  .g-nav button:hover { border-color: var(--tinte); }
  .g-nav button:focus-visible, .g-dots button:focus-visible, .g-teach a:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; }

  .g-stage { min-height: 200px; }
  .g-stage .scm-viz { background: transparent; }
  /* Bibliotheksfarben auf das Farbbudget der Galerie setzen: Graustufen, Akzent = TH-Rot */
  .g-stage .scm-viz, .g-stage #host { --viz-accent: var(--akzent); --viz-error: var(--akzent);
    --viz-information: var(--grau); --viz-financial: var(--grau);
    --viz-ink: var(--tinte); --viz-material: var(--tinte); --viz-muted: var(--grau);
    --viz-line: var(--linie); --viz-slot: #e4e4e4; --viz-hatch: #f3f3f3; --viz-bg: var(--grund); }
  .g-error { padding: 24px; border: 1px dashed var(--linie); color: var(--grau); border-radius: 6px; }
  .g-video { display: block; width: 100%; aspect-ratio: 16 / 9; height: auto; background: #000; border-radius: 6px; }
  .g-bild { display: block; width: 100%; height: auto; border: 1px solid var(--linie); border-radius: 6px; background: #fff; }
  .g-karte { margin: 0; border: 1px solid var(--linie); border-left: 4px solid var(--akzent); border-radius: 6px; padding: 14px 18px;
    display: grid; grid-template-columns: max-content 1fr; gap: 10px 18px; font-size: 16px; line-height: 1.45; }
  .g-karte dt { font-weight: 650; color: var(--grau); }
  .g-karte dd { margin: 0; }
  @media (max-width: 600px) { .g-karte { grid-template-columns: 1fr; gap: 2px; } .g-karte dd { margin-bottom: 8px; } }
  .g-frame { display: block; width: 100%; border: 1px solid var(--linie); border-radius: 6px; background: var(--grund); }

  .g-teach { display: grid; grid-template-columns: 1fr auto; gap: 4px 18px; align-items: start; margin-top: 10px;
    padding-top: 8px; border-top: 1px solid var(--linie); font-size: 15px; line-height: 1.5; }
  .g-teach p { margin: 0; }
  .g-teach .lehre { color: var(--grau); }
  .g-teach a { color: var(--akzent); font-weight: 600; text-decoration: none; white-space: nowrap; grid-row: 1; grid-column: 2; }
  .g-teach a:hover { text-decoration: underline; }
  .g-teach details { grid-column: 1 / -1; font-size: 12.5px; color: var(--grau); margin-top: 4px; }
  .g-teach summary { cursor: pointer; }

  .g-alle { text-align: center; margin: 12px 0 0; font-size: 15px; }
  .g-alle a { color: var(--akzent); font-weight: 600; text-decoration: none; }
  .g-alle a:hover { text-decoration: underline; }
  .g-dots { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
  .g-dots button { width: 12px; height: 12px; padding: 0; border-radius: 50%; border: 1px solid var(--grau); background: var(--grund); cursor: pointer; }
  .g-dots button[aria-current="true"] { background: var(--akzent); border-color: var(--akzent); }

  @media (max-width: 600px) {
    .g-head { grid-template-columns: 1fr auto; }
    .g-count { grid-column: 1 / -1; }
    .g-teach { grid-template-columns: 1fr; }
    .g-teach a { grid-row: auto; grid-column: 1; }
  }
</style>
</head>
<body>
<div class="g" id="galerie" role="region" aria-roledescription="Galerie" aria-label="Neun Praxisbeispiele, die mit generativer KI entstanden sind">
  <div class="g-head">
    <div class="g-count" id="count"></div>
    <h2 class="g-title" id="title"></h2>
    <div class="g-nav">
      <button type="button" id="prev" aria-label="Vorheriger Beitrag">&#8249;</button>
      <button type="button" id="next" aria-label="Nächster Beitrag">&#8250;</button>
    </div>
  </div>
  <div class="g-stage" id="stage" aria-live="polite"></div>
  <div class="g-teach" id="teach"></div>
  <div class="g-dots" id="dots"></div>
  <p class="g-alle"><a href="../praxisbeispiele.html" target="_top">Alle Praxisbeispiele des Buchs auf einer Seite →</a></p>
</div>

<script src="scm-viz/scm-viz.js"></script>
<script>
(function () {
  /* Neun Praxisbeispiele aus dem Buch, geordnet nach Reiz: ungewöhnlich, interaktiv, schön (Auswahl Claude, 02.11.2026; Agenten-Engpass am 13.11.2026 entfernt, Element steht nicht mehr im Buch). Typen: "page" (eingebettete Seite),
     "video" (MP4 mit Untertiteln), "viz" (Animation aus scm-viz.js), "image" (Standbild),
     "karte" (Szenario-Karte aus Zeilen [Begriff, Text]). "slug" ist der Deep-Link (#slug).
     "hoehe" ist die Rückfallhöhe des Rahmens [breit, schmal]; gemessen wird, wenn möglich, die echte Seitenhöhe.
     "link" führt aus der Galerie (im Kapitel per iframe eingebettet) zur Stelle im Buch. */
  var SLIDES = [
    {
      type: "page", slug: "token-film", src: "genrefilm-player.html?film=kap02-token-genres", hoehe: [900, 1100],
      kicker: "Kapitel 2 · Film mit Haltepunkten",
      title: "Ein Film erklärt das nächste Token in neun Genres und hält an, bis Sie vorhersagen",
      about: "Vom Film noir über Kochshow und Wetterbericht bis zum Märchen: dieselbe Kette aus Tokens, Nummern, Aufmerksamkeit und Wahrscheinlichkeiten, gut drei Minuten lang.",
      lehre: "Wer vor der Auflösung rät, behält die richtige Antwort besser, auch wenn der eigene Tipp falsch war.",
      link: "../kapitel02-grundlagen.html#vid-naechstes-token-genres",
      cite: "Film: Claude Code und HyperFrames 0.9.2 (HeyGen, 2026, https://github.com/heygen-com/hyperframes); Stimme KI-erzeugt (ElevenLabs v4); Bedeutungskarte und Wahrscheinlichkeiten schematisch. Idee: Mollick, E. (2026, 26. September). How do you explain recursion? [Video]. X. https://x.com/emollick/status/2103688362960019567 · Richland, L. E., Kornell, N., & Kao, L. S. (2009). The pretesting effect: Do unsuccessful retrieval attempts enhance learning? Journal of Experimental Psychology: Applied, 15(3), 243–257. https://doi.org/10.1037/a0016496"
    },
    {
      type: "video", slug: "lernsong", src: "media/lernsong-forecast.mp4",
      poster: "media/lernsong-forecast-poster.webp", vtt: "media/lernsong-forecast.vtt", vttLang: "en", vttLabel: "English (lyrics)",
      kicker: "Kapitel 7 · Lernsong",
      title: "Ein Lernsong macht fünf Prognoseverfahren singbar",
      about: "Fünf Verfahren an den Kaffeebechern eines erfundenen Campus-Cafés, mit Rechenpausen und mitlaufendem Diagramm.",
      lehre: "Der Song sichert Namen und Reihenfolge; das Rechnen tragen Lösungsbeispiele.",
      link: "../kapitel07-artefakte.html#sec-bsp-lernsong-forecast",
      cite: "Every Forecast Is Wrong · How Many Cups Tomorrow? (5:15, englisch, Liedtext als Untertitel). Text, Beispieldaten und Animationscode: Claude; Musik: Suno; geprüft von R. Bartnik 2026."
    },
    {
      type: "page", slug: "detektor-duell", src: "detektor-duell.html", hoehe: [1000, 1300],
      kicker: "Kapitel 5 · Spiel",
      title: "Im Duell mit einem Detektor zeigt sich, wie unsicher das Urteil über KI-Texte ist",
      about: "Acht Auszüge aus Erörterungen, vier von Schülerinnen und Schülern, vier von einem Sprachmodell. Erst urteilen Sie, dann der Detektor.",
      lehre: "Der Lehr-Detektor erkennt manche KI-Texte und hält zugleich echte Aufsätze für maschinell; diesen Preis sieht man erst im Vergleich.",
      link: "../kapitel05-4d-phasen.html#sec-detektor-duell",
      cite: "Spiel und Lehr-Detektor: Claude nach Vorgaben von R. Bartnik 2026; Ergebnisse des Detektors in Kapitel 5. Liang, W., Yuksekgonul, M., Mao, Y., Wu, E., & Zou, J. (2023). GPT detectors are biased against non-native English writers. Patterns, 4(7), 100779. https://doi.org/10.1016/j.patter.2023.100779"
    },
    {
      type: "video", slug: "kaya-teaser", src: "media/kaya-teaser.mp4", poster: "media/kaya-teaser-poster.webp", loop: true,
      kicker: "Kapitel 7 · KI-Video",
      title: "Fünf Sekunden Film eröffnen eine Fallstudie: Aylin Kaya, Nachtschicht, 1.800 Brötchen",
      about: "Der Teaser zur Fallstudie Backhaus Kaya, ohne Ton; die Bäckerei und ihre Figuren sind erfunden.",
      lehre: "Eine Geschichte mit Person und Konflikt behält man besser als Sachtext; die Rechnungen des Falls sind Prüfungsstoff.",
      link: "../kapitel07-artefakte.html#sec-bsp-fallstudie",
      cite: "KI-generiertes Video (LTX-2.5), R. Bartnik 2026. Willingham, D. T. (2009). Why don't students like school? Jossey-Bass."
    },
    {
      type: "page", slug: "hoeher-tiefer", src: "hoeher-tiefer-ki-aufgaben.html", hoehe: [820, 1000],
      kicker: "Kapitel 1 · Spiel mit echten Daten",
      title: "Höher oder tiefer: Raten Sie, wofür Menschen KI wirklich nutzen",
      about: "Paare von Arbeitsaufgaben aus Gesprächen mit Claude; Sie tippen, welche häufiger vorkommt, und nennen Ihre Sicherheit.",
      lehre: "Beobachtete Nutzung statt Umfrage: Wo Sie sich sicher waren und falsch lagen, sitzt die Korrektur am tiefsten.",
      link: "../kapitel01-einleitung.html#sec-spiel-ki-aufgaben",
      cite: "Daten: Anthropic Economic Index, Release vom 26. Juni 2026 (Datenmonat Mai 2026), CC BY. Massenkoff, M., Lyubich, E., Sacher, S., Hitzig, Z., Zhang, S., Heller, R., & McCrory, P. (2026). Anthropic Economic Index report: Cadences. Anthropic. · Spiel: Claude nach Vorgaben von R. Bartnik 2026."
    },
    {
      type: "page", slug: "linien-widget", src: "line-widget.html", hoehe: [1150, 1500],
      kicker: "Kapitel 7 · Interaktives Widget",
      title: "Am Linien-Widget finden Studierende den Engpass selbst",
      about: "Pizzalinie oder Brötchenlinie: Arbeitsschritte, Personal und Öfen verändern, Kapazität und Durchlaufzeit sofort ablesen (englisch).",
      lehre: "Drei Arbeitsaufträge lenken das Ausprobieren; freies Spielen an den Reglern allein lehrt weniger.",
      link: "../kapitel07-artefakte.html#sec-bsp-widgets",
      cite: "Widget aus Woche 2 des Moduls Sustainable Supply Chain Management (TH Köln), mit Claude nach Vorgaben von R. Bartnik 2026; jede Zahl in Python gerechnet."
    },
    {
      type: "page", slug: "arbeitsweisen", src: "ki-arbeitsweisen-durchspiel.html", hoehe: [1400, 1900],
      kicker: "Kapitel 3 · Durchspiel",
      title: "Dieselbe Aufgabe in fünf Arbeitsweisen, vom Centaur bis zur dunklen Fabrik",
      about: "Ein Übungsblatt, Projektberichte oder eine Vorlesung: Mit jeder Stufe spricht der Mensch weniger und die Agenten mehr miteinander.",
      lehre: "Vor jedem Schritt steht eine Vorhersage: Wo fällt dem Menschen noch eine Entscheidung zu?",
      link: "../kapitel03-automation.html#sec-arbeitsweisen",
      cite: "Dialoge nachgestellt und gekürzt, Denkspuren angenähert, Zähler als Lehrmodell. Dell'Acqua, F., McFowland, E., Mollick, E. R., Lifshitz-Assaf, H., Kellogg, K., Rajendran, S., Krayer, L., Candelon, F., & Lakhani, K. R. (2023). Navigating the jagged technological frontier (Working Paper 24-013). Harvard Business School. https://doi.org/10.2139/ssrn.4573321"
    },
    {
      type: "page", slug: "tutor-kosten", src: "tutor-kosten.html", hoehe: [950, 1200],
      kicker: "Kapitel 5 · Rechner",
      title: "Ein Tutor-Bot für 150 Studierende kostete 2025 rund 8.800 US-$, 2026 rund 12 US-$",
      about: "Eigene Kursgröße eintragen und zusehen, wie die Semesterkosten mit jeder Preisstufe fallen.",
      lehre: "Größenordnungen statt Preislisten: Die Frage ist nicht mehr, ob man sich einen Tutor leisten kann, sondern ob er das Lernen stärkt.",
      link: "../kapitel05-4d-phasen.html#sec-capabilities",
      cite: "Kosten je Frage nach Epoch AI (Emberson & Roodman, 2026); API-Preise in US-Dollar; nur Größenordnungen. Rechner: Claude nach Vorgaben von R. Bartnik 2026."
    },
    {
      type: "video", slug: "making-of", src: "media/kap04-making-of.mp4", poster: "media/kap04-making-of-poster.png",
      kicker: "Kapitel 6 · Making-of",
      title: "Was Code ist, schreibt die KI; prüfen bleibt Sache der Lehrperson",
      about: "In 59 Sekunden vom Auftrag zum fertigen Erklärvideo: Datendatei, Code, automatische Prüfung, Sichtprüfung, Rendern.",
      lehre: "Rekonstruiert aus dem Versionsprotokoll einer echten Arbeitssitzung, ohne Bildschirmaufnahme.",
      link: "../kapitel06-rollen.html#sec-coding",
      cite: "Video ohne Ton, erstellt mit Claude Code und HyperFrames (HeyGen, 2026, https://github.com/heygen-com/hyperframes); R. Bartnik 2026."
    }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var handle = null, idx = 0, beobachter = null;
  var schmal = function () { return window.innerWidth < 600; };

  /* Höhe an die einbettende Seite melden (Kapitel 1 passt den iframe an), damit kein Scrollbalken entsteht. */
  /* Inhaltshöhe statt scrollHeight: scrollHeight ist nie kleiner als der Rahmen, der Rahmen schrumpfte sonst nie. */
  function inhalt(d) {
    var b = d.body, cs = d.defaultView.getComputedStyle(b);
    return Math.ceil(b.getBoundingClientRect().height + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom));
  }
  function melde() {
    try { parent.postMessage({ typ: "galerie-hoehe", id: "galerie-vorwort", h: inhalt(document) }, "*"); } catch (e) {}
  }
  if (window.ResizeObserver) new ResizeObserver(melde).observe(document.body);

  function rahmenHoehe(f, s) {
    f.style.height = s.hoehe[schmal() ? 1 : 0] + "px";
    f.addEventListener("load", function () {
      try {                                   /* gleiche Herkunft: echte Höhe der eingebetteten Seite übernehmen */
        var d = f.contentDocument, passe = function () { var h = inhalt(d); if (h > 150) f.style.height = (h + 2) + "px"; };
        passe();
        if (window.ResizeObserver) { beobachter = new ResizeObserver(passe); beobachter.observe(d.body); }
      } catch (e) { /* andere Herkunft (z. B. file://): Rückfallhöhe bleibt */ }
    });
  }

  function mountStage(s) {
    if (handle) { try { handle.destroy(); } catch (e) {} handle = null; }
    if (beobachter) { beobachter.disconnect(); beobachter = null; }
    var stage = $("stage"); stage.innerHTML = "";
    if (s.type === "video") {
      var v = document.createElement("video");
      v.className = "g-video"; v.controls = true; v.playsInline = true; v.preload = "metadata";
      v.poster = s.poster; v.setAttribute("aria-label", s.title);
      var q = document.createElement("source"); q.src = s.src; q.type = "video/mp4"; v.appendChild(q);
      if (s.vtt) { var t = document.createElement("track"); t.kind = "subtitles"; t.srclang = s.vttLang; t.label = s.vttLabel; t.src = s.vtt; t.default = true; v.appendChild(t); }
      if (s.loop) { v.loop = true; v.muted = true; }
      v.addEventListener("loadedmetadata", melde);
      stage.appendChild(v);
    } else if (s.type === "image") {
      var im = document.createElement("img");
      im.className = "g-bild"; im.src = s.src; im.alt = s.alt; im.addEventListener("load", melde);
      stage.appendChild(im);
    } else if (s.type === "karte") {
      var dl = document.createElement("dl"); dl.className = "g-karte";
      s.zeilen.forEach(function (z) {
        var dt = document.createElement("dt"); dt.textContent = z[0]; dl.appendChild(dt);
        var dd = document.createElement("dd"); dd.textContent = z[1]; dl.appendChild(dd);
      });
      stage.appendChild(dl);
    } else if (s.type === "page") {
      var f = document.createElement("iframe");
      f.className = "g-frame"; f.src = s.src; f.title = s.title;
      f.setAttribute("allow", "fullscreen");
      rahmenHoehe(f, s);
      stage.appendChild(f);
    } else {
      var host = document.createElement("div"); host.id = "host"; stage.appendChild(host);
      try {
        handle = SCMViz.mount(host, { viz: s.viz, scenario: s.scenario, lang: "de", title: "hide" });
      } catch (e) {
        host.className = "g-error";
        host.textContent = "Diese Animation konnte nicht geladen werden: " + e.message;
      }
    }
  }

  function show(i) {
    idx = (i + SLIDES.length) % SLIDES.length;
    var s = SLIDES[idx];
    $("count").textContent = (idx + 1) + " / " + SLIDES.length;
    $("count").setAttribute("aria-label", "Beitrag " + (idx + 1) + " von " + SLIDES.length);
    $("title").textContent = s.title;
    var small = document.createElement("small"); small.textContent = s.kicker; $("title").appendChild(small);

    mountStage(s);

    var t = $("teach"); t.textContent = "";
    var p = document.createElement("p"); p.textContent = s.about; t.appendChild(p);
    if (s.link) { var a = document.createElement("a"); a.href = s.link; a.target = "_top"; a.textContent = "Im Buch ansehen →"; t.appendChild(a); }
    var l = document.createElement("p"); l.className = "lehre"; l.textContent = s.lehre; t.appendChild(l);
    var d = document.createElement("details"), su = document.createElement("summary");
    su.textContent = "Quelle"; d.appendChild(su);
    var c = document.createElement("p"); c.textContent = s.cite; d.appendChild(c); t.appendChild(d);

    var dots = $("dots"); dots.textContent = "";
    SLIDES.forEach(function (sl, k) {
      var b = document.createElement("button"); b.type = "button";
      b.setAttribute("aria-label", "Beitrag " + (k + 1) + ": " + sl.title);
      b.setAttribute("aria-current", String(k === idx));
      b.addEventListener("click", function () { show(k); });
      dots.appendChild(b);
    });
    try { history.replaceState(null, "", "#" + s.slug); } catch (e) {}
    melde();
  }

  $("prev").addEventListener("click", function () { show(idx - 1); });
  $("next").addEventListener("click", function () { show(idx + 1); });
  document.addEventListener("keydown", function (e) {
    if (e.target && /input|select|textarea|video/i.test(e.target.tagName)) return;
    if (e.key === "ArrowLeft") show(idx - 1);
    if (e.key === "ArrowRight") show(idx + 1);
  });

  var start = 0, hash = String(location.hash || "").replace(/^#/, "");
  SLIDES.forEach(function (s, k) { if (s.slug === hash) start = k; });
  show(start);
  window.ANIM = { gehe: show, letzter: SLIDES.length - 1 };   /* für das Prüfskript */
})();
</script>
</body>
</html>
