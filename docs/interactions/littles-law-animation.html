<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little's Law zählen: Animation</title>
<link rel="stylesheet" href="scm-viz/scm-viz.css">
<style>
  :root { --bg: #ffffff; --ink: #1a1a1a; --muted: #5f5f5f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141414; --ink: #f2f2f2; --muted: #b5b5b5; } }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #host { max-width: 960px; margin: 0 auto; }
  .ll-error { padding: 16px; color: var(--muted); }
</style>
</head>
<body>
<!-- Animation „littles-law“ aus dem Offline-Bundle scm-viz (s. scm-viz/HERKUNFT.md).
     Aufruf nach dem Muster von galerie-animationen.html; Szenario per #hash wählbar. -->
<div id="host"></div>
<script src="scm-viz/scm-viz.js"></script>
<script>
(function () {
  var host = document.getElementById("host");
  var szenario = String(location.hash || "").replace(/^#/, "") || undefined;
  try {
    SCMViz.mount(host, { viz: "littles-law", scenario: szenario, lang: "de" });
  } catch (e) {
    host.className = "ll-error";
    host.textContent = "Diese Animation konnte nicht geladen werden: " + e.message;
  }
})();
</script>
</body>
</html>
